<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wednes Serverless Engine Docs</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            colors: {
              background: '#0d1117',
              foreground: '#c9d1d9',
              primary: '#2f81f7',
              card: '#161b22',
              border: '#30363d'
            }
          }
        }
      }
    </script>
    <style>
      body { background-color: #0d1117; color: #c9d1d9; }
      pre { background-color: #161b22; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; border: 1px solid #30363d; margin: 1rem 0; }
      code { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; font-size: 0.875rem; }
      h1, h2, h3 { color: #ffffff; font-weight: 600; margin-top: 2rem; margin-bottom: 1rem; }
      h1 { font-size: 2.25rem; }
      h2 { font-size: 1.5rem; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; }
      h3 { font-size: 1.25rem; }
      p { margin-bottom: 1rem; line-height: 1.6; }
      ul { list-style-type: disc; margin-left: 1.5rem; margin-bottom: 1rem; }
      li { margin-bottom: 0.5rem; }
      a { color: #2f81f7; text-decoration: none; }
      a:hover { text-decoration: underline; }
      .sidebar-link { display: block; padding: 0.5rem 1rem; color: #8b949e; border-radius: 0.375rem; font-size: 0.875rem; }
      .sidebar-link:hover { background-color: #161b22; color: #c9d1d9; }
      .sidebar-link.active { background-color: #1f6feb26; color: #58a6ff; font-weight: 500; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
