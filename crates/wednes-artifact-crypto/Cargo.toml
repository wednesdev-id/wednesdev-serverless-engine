[package]
name = "wednes-artifact-crypto"
version = "0.1.0"
edition = "2021"

[lib]
name = "wednes_artifact_crypto"
path = "src/lib.rs"

[[bin]]
name = "wednes-artifact-crypto"
path = "src/bin/wednes_artifact_crypto.rs"

[[bin]]
name = "wednes"
path = "src/bin/wednes.rs"

[dependencies]
aes-gcm = "0.10"
chacha20poly1305 = "0.10"
zeroize = { version = "1.8", features = ["derive"] }
anyhow = "1.0"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
hex = "0.4"
