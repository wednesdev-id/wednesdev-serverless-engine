[package]
name = "wednes-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "wednesd"
path = "src/main.rs"

[dependencies]
rcgen = "0.13"
rustls = { version = "0.23", features = ["ring"] }
wednes-core = { path = "../wednes-core" }
wednes-runtime = { path = "../wednes-runtime" }
wednes-runtime-wasmtime = { path = "../wednes-runtime-wasmtime" }
wednes-gateway = { path = "../wednes-gateway" }
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
notify = "8.2.0"
quinn = "0.11.12"
h3 = "0.0.8"
h3-quinn = "0.0.10"
tower = "0.5.3"
bytes.workspace = true
http-body = { version = "1.1.0", default-features = false }
[dev-dependencies]
tempfile = "3"
serde_json.workspace = true
