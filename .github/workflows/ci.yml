name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --target wasm32-wasip1
          rustup default stable
      - name: Install component tooling
        run: cargo install wasm-tools --version 1.261.0 --locked
      - name: Build and validate component fixtures before tests
        run: bash scripts/build-fixtures.sh
      - name: Run tests
        run: cargo test --workspace
      - name: Check format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Build release
        run: cargo build --release
